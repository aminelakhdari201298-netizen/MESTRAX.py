services:
  - type: web
    name: mestrax-proxy-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python Proxyresell.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_ID
        value: "8254258071"
      - key: BOT_OWNER_NAME
        value: "MESTRAX PROXY PREMIUM"
      - key: DATA_FILE
        value: "mestrax_data.json"
